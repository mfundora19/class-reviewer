<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Offline study and review app for CompTIA Linux+ and Network+ certifications" />
  <title>ReviewApp</title>
  <link rel="icon" type="image/svg+xml" href="app/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="app/shortcut-icon.ico" />
  <link rel="stylesheet" href="app/css/styles.css?v=31" />
</head>
<body>
  <div id="app" class="app-shell" role="application" aria-label="ReviewApp study interface">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="sidebar-header">
        <button id="sidebar-toggle" class="logo logo-btn" aria-label="Collapse sidebar" title="Toggle sidebar">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true" focusable="false">
            <path d="M14 5.5l9 4.5-9 4.5-9-4.5 9-4.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M8.5 15v2.5c0 2 2.4 3.7 5.5 3.7s5.5-1.7 5.5-3.7V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M23 10v7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M23 19.3l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <span class="logo-text">ReviewApp</span>
      </div>
      <nav class="sidebar-nav" role="navigation">
        <div class="nav-group">
          <span class="nav-group-label" aria-hidden="true">STUDY</span>
          <a href="#/dashboard" class="nav-item" data-route="dashboard">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="10" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="10" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>
            <span>Dashboard</span>
          </a>
        </div>
        <div class="nav-group">
          <span class="nav-group-label" aria-hidden="true">PRACTICE</span>
          <a href="#/flashcards" class="nav-item" data-route="flashcards">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="3" width="10" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 5h6M5 8h6M5 11h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M13 5h2a1 1 0 011 1v9a1 1 0 01-1 1H6" stroke="currentColor" stroke-width="1.3"/></svg>
            <span>Flashcards</span>
          </a>
          <a href="#/quiz" class="nav-item" data-route="quiz">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5v4l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Quiz</span>
          </a>
          <a href="#/labs" class="nav-item" data-route="labs">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M6 2h6v4l3 6v2H3v-2l3-6V2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 2v2M11 2v2" stroke="currentColor" stroke-width="1.3"/></svg>
            <span>Labs</span>
          </a>
          <a href="#/exam" class="nav-item" data-route="exam">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="2" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 6h6M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span>Exam Sim</span>
          </a>
        </div>
        <div class="nav-group">
          <span class="nav-group-label" aria-hidden="true">INSIGHTS</span>
          <a href="#/stats" class="nav-item" data-route="stats">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 14V9M7 14V5M11 14v-4M15 14V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Stats</span>
          </a>
          <a href="#/notes" class="nav-item" data-route="notes">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 2h8l3 3v11a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4"/><path d="M12 2v3h3M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span>Notes</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="nav-group sidebar-footer-nav">
          <a href="#/tools" class="nav-item" data-route="tools">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11.5 3.5l3 3-7 7H4.5v-3l7-7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.5 5.5l3 3" stroke="currentColor" stroke-width="1.3"/></svg>
            <span>Tools</span>
          </a>
          <a href="#/settings" class="nav-item" data-route="settings">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M9 2v2M9 14v2M2 9h2M14 9h2M4.2 4.2l1.4 1.4M12.4 12.4l1.4 1.4M4.2 13.8l1.4-1.4M12.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span>Settings</span>
          </a>
        </div>
        <div class="version-badge">v1.0.10 · offline</div>
      </div>
    </aside>

    <!-- Main area -->
    <div class="main-area">
      <header class="topbar" role="banner">
        <button id="mobile-menu" class="icon-btn mobile-only" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input type="search" id="global-search" class="search-input" placeholder="Search questions, cards, labs, ports…" aria-label="Global search" autocomplete="off" />
          <div id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></div>
        </div>
        <div class="topbar-actions">
          <button id="reload-content" class="icon-btn" aria-label="Reload content" title="Reload content">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M15 9a6 6 0 11-1.5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M15 3v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="cert-picker" id="cert-picker" title="Current certification"></div>
        </div>
      </header>
      <main id="view-root" class="view-root" role="main" aria-live="polite"></main>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal root -->
  <div id="modal-root" class="modal-root" hidden></div>

  <!-- Scripts: classic, ordered, no modules. ?v= busts the browser cache so
       updated app files are never served stale (content files already do this). -->
  <script src="app/js/core.js?v=9"></script>
  <script src="app/js/persistence.js?v=3"></script>
  <script src="app/js/store.js?v=10"></script>
  <script src="app/js/markdown.js?v=7"></script>
  <script src="app/js/content.js?v=8"></script>
  <script src="app/js/quiz.js?v=21"></script>
  <script src="app/js/flashcards.js?v=10"></script>
  <script src="app/js/tools.js?v=6"></script>
  <script src="app/js/backup.js?v=5"></script>
  <script src="app/js/views.js?v=51"></script>
  <script>
    // Boot
    (function () {
      'use strict';
      if (!window.ReviewApp) window.ReviewApp = {};
      document.addEventListener('DOMContentLoaded', function () {
        var root = document.getElementById('view-root');
        if (root) root.textContent = 'Loading local study data…';
        ReviewApp.store.init().then(function (result) {
          ReviewApp.core.init();
          if (result && result.notice && ReviewApp.toast) {
            setTimeout(function () { ReviewApp.toast(result.notice, result.available ? 'info' : 'error', 7000); }, 0);
          }
        }).catch(function (err) {
          if (root) {
            root.innerHTML = '<div class="empty-state"><h3>Local data could not be opened</h3><p>Please close other ReviewApp tabs and reload. Your legacy local data was not deleted.</p></div>';
          }
          console.error('ReviewApp storage initialization failed:', err);
        });
      });
    })();
  </script>
</body>
</html>
